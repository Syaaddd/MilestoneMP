database:
  type: sqlite
  host: localhost
  port: 3306
  database: milestoneMP
  username: root
  password: ""

settings:
  check-interval: 60
  community-reward-broadcast: true

messages:
  prefix: "&8[&6Milestone&8] "
  milestone-available: "&aMilestone available! Click to claim."
  milestone-locked: "&cThis milestone is still locked."
  milestone-claimed: "&eReward claimed: %reward%"
  no-milestone: "&cNo milestone available."
  player-not-found: "&cPlayer not found."
  config-reloaded: "&aConfiguration reloaded successfully."
  no-permission: "&cYou don't have permission."
  already-claimed: "&cThis milestone has already been claimed."
  milestone-claimed-self: "&eYou claimed: %reward%"

gui:
  title: "&8Progression Tree"
  available-color: "&a"
  locked-color: "&7"
  claimed-color: "&e"
  claim-button: "&aClick to Claim"
  choose-button: "&eChoose Reward"
  milestone-slots:
    - 10
    - 12
    - 14
    - 16
    - 19
    - 21
    - 23
    - 25
    - 28
    - 30
    - 32
    - 34

milestones:
  beginner:
    type: PLAYTIME
    amount: 3600
    icon: CLOCK
    color: "&6"
    choices:
      - id: reward_fly
        name: "&bElytra Rental (1 Hour)"
        command: "give {player} elytra 1"
      - id: reward_money
        name: "&61000 Server Money"
        command: "eco give {player} 1000"
  
  intermediate:
    type: PLAYTIME
    amount: 7200
    icon: COMPASS
    color: "&9"
    choices:
      - id: reward_token
        name: "&d10 Tokens"
        command: "tokens give {player} 10"
      - id: reward_voucher
        name: "&5Shop Voucher"
        command: "give {player} paper 1"

  advanced:
    type: BLOCK_BREAK
    amount: 5000
    icon: DIAMOND_PICKAXE
    color: "&e"
    choices:
      - id: reward_pickaxe
        name: "&ePickaxe Efficiency V"
        command: "give {player} diamond_pickaxe{Enchantments:[{id:efficiency,lvl:5}]}"

  pro:
    type: PLAYER_KILL
    amount: 100
    icon: IRON_SWORD
    color: "&c"
    choices:
      - id: reward_sword
        name: "&cSword Sharpness V"
        command: "give {player} diamond_sword{Enchantments:[{id:sharpness,lvl:5}]}"
      - id: reward_combat
        name: "&450 Levels XP"
        command: "xp give {player} 50 levels"
